name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The tests are dependency-free on purpose: a bare clone can validate the
      # generated patch layer without installing anything.
      - run: npm test
